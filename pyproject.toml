[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-optimal-liquidation"
version = "0.0.1"
description = "Reinforcement learning framework for optimal trade execution / liquidation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andy Au" }]
dependencies = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tensorboard>=2.13",
    "tqdm>=4.65",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jupyter>=1.0", "ipykernel>=6.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/rl_optimal_liquidation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

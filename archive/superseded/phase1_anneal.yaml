# Phase 1 with two-phase LR schedule (Robbins-Monro confirmation experiment).
#
# Identical to configs/phase1.yaml in every respect EXCEPT lr_schedule.
# Tests the journal's "constant-step-size PG noise floor" diagnosis directly:
# constant LR=3e-4 for the first 800k steps (find the basin via PPO's noisy
# updates), then anneal LR linearly to 0 over the final 200k (close the
# noise-floor ball).
#
# Predicted outcome: gap to AC drops well below the 2.84% noise-floor mean
# observed in configs/phase1.yaml (with constant LR throughout). If gap stays
# at ~3%, the residual is not LR-step-size and we have a more interesting
# finding (likely Beta concentration-gradient noise).

env:
  Q: 1.0e+6
  T: 1.0
  N: 50
  S0: 100.0
  mu: 0.0
  sigma: 0.3
  eta: 1.0e-6
  gamma: 1.0e-7
  lam: 1.0e-6
  terminal_penalty: 1.0e-3
  include_price_obs: false
  include_vol_obs: false
  sigma_profile: constant
  sigma_amplitude: 0.0
  sigma_noise_std: 0.0

n_envs: 8

ppo:
  policy: beta
  device: cpu
  learning_rate: 3.0e-4
  lr_schedule: two_phase     # << only difference from phase1.yaml
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03

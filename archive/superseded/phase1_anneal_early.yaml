# Phase 1 with EARLY two-phase LR annealing (constant for first 200k, anneal
# linearly to 0 over the remaining 800k).
#
# Designed to actually test the noise-floor / cliff-instability question that
# the late-anneal variant (configs/phase1_anneal.yaml) couldn't:
# save-best's lucky transit through AC's neighborhood happens BEFORE step 800k,
# so late annealing leaves the saved checkpoint unchanged. With early
# annealing, save-best samples from the annealed phase — so if PPO actually
# converges to a tight ball, the final model should also land at low gap
# (final ≈ best). If the final model is still wandering at 50-500%, PPO does
# not stably converge here and the residual ~3% Phase 1 gap is a deployment-
# only number from cliff-jitter, not a convergence number.

env:
  Q: 1.0e+6
  T: 1.0
  N: 50
  S0: 100.0
  mu: 0.0
  sigma: 0.3
  eta: 1.0e-6
  gamma: 1.0e-7
  lam: 1.0e-6
  terminal_penalty: 1.0e-3
  include_price_obs: false
  include_vol_obs: false
  sigma_profile: constant
  sigma_amplitude: 0.0
  sigma_noise_std: 0.0

n_envs: 8

ppo:
  policy: beta
  device: cpu
  learning_rate: 3.0e-4
  lr_schedule: two_phase
  lr_const_fraction: 0.2      # constant LR for first 20% (~200k), anneal over remaining 80%
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03

# Phase 2 spread-conditioning — per-step stochastic eta (log-AR(1)).
#
# Tests whether PPO can learn closed-loop conditioning when the stochastic
# friction enters the IMMEDIATE step reward (vs Phase 2 vol where it enters
# the integrated inventory penalty over the horizon).
#
# Two noise levels tested:
#   eta_noise_std=0.3 (default in original spec): with sqrt(dt) scaling the
#     effective per-step range is [0.84, 1.16] x eta_mean. Oracle = 0.18%
#     above AC. No value to capture; agent was 1% worse than AC.
#   eta_noise_std=2.0 (this config): effective range [0.5, 2.0]. Oracle =
#     7.55% above AC. Agent learns strong direction-correct conditioning
#     (max sensitivity 0.28) but with too-high variance — agent's true
#     mean cost is ~5-6% worse than AC across 5 seeds, even though best
#     snapshots within 1% of oracle.
#
# Informative *mixed* result: closed-loop is learned, magnitude is mistuned.
# Distinct from per-episode vol-conditioning success.

env:
  Q: 1.0e+6
  T: 1.0
  N: 50
  S0: 100.0
  mu: 0.0
  sigma: 0.3
  eta: 1.0e-6              # MEAN of log-AR(1) when stochastic
  gamma: 1.0e-7
  lam: 1.0e-4              # kappa*T = 3.0
  terminal_penalty: 1.0e-3
  include_price_obs: false
  include_vol_obs: false
  include_eta_obs: true    # eta_k / eta_mean in obs
  impact_type: linear
  sigma_profile: constant
  sigma_amplitude: 0.0
  sigma_noise_std: 0.0
  eta_rho: 0.9             # AR(1) persistence on log eta
  eta_noise_std: 2.0       # gives effective per-step eta range [0.5, 2.0] x mean

n_envs: 8

ppo:
  policy: beta
  device: cpu
  learning_rate: 1.0e-4
  lr_schedule: constant
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.25
  target_kl: 0.03

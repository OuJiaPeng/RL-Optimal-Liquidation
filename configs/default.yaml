# Default config = Phase 1 (reproduce Almgren-Chriss in the linear-impact
# regime). PPO+Beta+1M should land within [0.8, 4.0]% of AC across seeds.
#
# For Phase 2 experiments, use one of:
#   --config configs/phase2_vol.yaml     (time-varying sigma, positive result)
#   --config configs/phase2_spread.yaml  (stochastic eta, informative mixed result)
#
# Identical to configs/phase1.yaml. Kept as a separate file so scripts that
# default to "configs/default.yaml" reproduce the canonical Phase 1 baseline
# without requiring an explicit --config flag.
#
# YAML 1.1 quirk: scientific notation needs an explicit sign on the exponent
# (1.0e+6 not 1.0e6). LiquidationParams.__post_init__ coerces strings to
# float as a safety net.

env:
  Q: 1.0e+6
  T: 1.0
  N: 50
  S0: 100.0
  mu: 0.0
  sigma: 0.3
  eta: 1.0e-6
  gamma: 1.0e-7
  lam: 1.0e-6              # kappa*T = 0.3 (near-TWAP regime)
  terminal_penalty: 1.0e-3
  include_price_obs: false
  include_vol_obs: false
  include_eta_obs: false
  impact_type: linear
  sigma_profile: constant
  sigma_amplitude: 0.0
  sigma_noise_std: 0.0
  eta_rho: 0.0
  eta_noise_std: 0.0

n_envs: 8

ppo:
  policy: beta
  device: cpu
  learning_rate: 3.0e-4
  lr_schedule: constant
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03

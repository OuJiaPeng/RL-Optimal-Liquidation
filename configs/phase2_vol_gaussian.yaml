# Phase 2 vol-conditioning — FEATURED config (Gaussian policy).
#
# Identical to phase2_vol.yaml except policy: gaussian (SB3 default MlpPolicy,
# clipped DiagGaussian on Box(0,1)). Started as an ablation of the inherited
# Beta-beats-Gaussian claim; inverted it in this regime: 5/5 seeds discover
# sigma_hat-conditioning, -3.41% [-3.93, -2.89] vs naive AC, clearing
# smart-static (-1.33%) on every seed and capturing ~73% of CE-AC (-4.66%).
# Likely mechanism: shared state-independent log-std keeps exploration alive;
# Beta's state-dependent concentration sharpens prematurely (2/5 discovery).

env:
  Q: 1.0e+6
  T: 1.0
  N: 50
  S0: 100.0
  mu: 0.0
  sigma: 0.3
  eta: 1.0e-6
  gamma: 1.0e-7
  lam: 1.0e-4              # kappa*T = 3.0 — schedule structure matters
  terminal_penalty: 1.0e-3
  include_price_obs: false
  include_vol_obs: true    # sigma_hat / sigma_0 in obs
  sigma_profile: u_shaped
  sigma_amplitude: 0.5
  sigma_noise_std: 0.3     # per-episode multiplicative scale

n_envs: 8

ppo:
  policy: gaussian
  device: cpu
  learning_rate: 1.0e-4
  lr_schedule: constant
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0            # exploration comes from the shared state-independent
                           # log-std; an entropy bonus would distort the pure-cost
                           # objective without addressing discovery
  vf_coef: 0.5
  max_grad_norm: 0.25
  target_kl: 0.03
